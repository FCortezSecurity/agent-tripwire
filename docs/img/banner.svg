<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Agent Tripwire</title>
  <desc id="desc">Runtime security for AI agents and MCP tools</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#12202b"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#2dd4bf" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f85149" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f85149" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="298" rx="18" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>

  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200"/>
    <path d="M100 0V300M300 0V300M500 0V300M700 0V300M900 0V300M1100 0V300"/>
  </g>

  <!-- title block -->
  <text x="70" y="112" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="66" font-weight="700" fill="#f0f6fc">Agent Tripwire</text>
  <text x="72" y="158" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#9da7b3">Runtime security for AI agents and MCP tools</text>

  <!-- tripwire -->
  <rect x="56" y="196" width="10" height="44" rx="3" fill="#6e7681"/>
  <rect x="1134" y="196" width="10" height="44" rx="3" fill="#6e7681"/>
  <line x1="66" y1="214" x2="1134" y2="214" stroke="url(#wire)" stroke-width="3" stroke-dasharray="10 8" stroke-linecap="round"/>

  <!-- tripped point -->
  <circle cx="930" cy="214" r="46" fill="url(#glow)"/>
  <circle cx="930" cy="214" r="24" fill="none" stroke="#f85149" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="930" cy="214" r="13" fill="none" stroke="#f85149" stroke-opacity="0.65" stroke-width="2"/>
  <circle cx="930" cy="214" r="6" fill="#f85149"/>

  <!-- capabilities -->
  <text x="72" y="268" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" letter-spacing="0.5" fill="#7d8590">policy enforcement  ·  attack detection  ·  canary traps  ·  adversarial testing</text>
</svg>
