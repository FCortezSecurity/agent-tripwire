title: TW-006 Secret-looking content returned to the agent
id: 7d659f0b-71b7-43d2-811f-e4be60469a64
name: tripwire_secret_content_in_result
status: experimental
description: >
  A successful tool result contains key=value or key: value pairs for names such as
  password, secret, token, or api key. Inspects content rather than file names, so it
  still fires if secrets are copied to an innocent-looking path. Covers S5 and S6.
tags:
  - owasp.llm02
  - atlas.aml.t0057
logsource:
  product: agent_tripwire
  category: tool_result
detection:
  selection_ok:
    is_error: false
  selection_secret:
    result_text|re: '(?i)(api[_-]?key|service[_-]?key|secret|token|passw(or)?d|pwd|passcode|passphrase|credentials?|bearer|private[_-]?key)\s*[=:]\s*\S+|-----BEGIN [A-Z ]*PRIVATE KEY-----'
  condition: selection_ok and selection_secret
falsepositives:
  - Configuration examples, documentation, or code that legitimately shows credentials syntax.
level: high
